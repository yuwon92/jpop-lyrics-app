name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            # latest.yml과 .blockmap은 electron-updater 자동 업데이트 확인·차등 다운로드에 필요
            artifact: |
              dist/*.exe
              dist/*.blockmap
              dist/latest.yml
          - os: macos-latest
            artifact: dist/*.dmg

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        # publish 설정이 있으면 태그 빌드에서 electron-builder가 직접 릴리즈를 올리려 하므로
        # never로 막고, 업로드는 아래 softprops 스텝이 일관되게 담당한다
        run: npm run package -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
